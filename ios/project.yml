name: AmberCircles
options:
  bundleIdPrefix: com.calebnewton.amber
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    DEVELOPMENT_TEAM: 4DMVHH99R2
    CODE_SIGN_STYLE: Automatic
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "2.0"
    CURRENT_PROJECT_VERSION: "37"
    TARGETED_DEVICE_FAMILY: "1"
targets:
  Amber:
    type: application
    platform: iOS
    sources:
      - App
      - path: Shared
    dependencies:
      - target: AmberMessages
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: Amber
        UILaunchScreen: {}
        UIRequiresFullScreen: true
        ITSAppUsesNonExemptEncryption: false
        UIAppFonts:
          - AtkinsonHyperlegibleNext-Regular.ttf
          - AtkinsonHyperlegibleNext-Bold.ttf
          - AtkinsonHyperlegibleNext-ExtraBold.ttf
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.calebnewton.amber
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
  AmberMessages:
    type: app-extension.messages
    platform: iOS
    sources:
      - Messages
      - path: Shared
    info:
      path: Messages/Info.plist
      properties:
        CFBundleDisplayName: Amber
        ITSAppUsesNonExemptEncryption: false
        UIAppFonts:
          - AtkinsonHyperlegibleNext-Regular.ttf
          - AtkinsonHyperlegibleNext-Bold.ttf
          - AtkinsonHyperlegibleNext-ExtraBold.ttf
        NSMicrophoneUsageDescription: Amber listens while you hold the talk button, so you can say what to change instead of typing it.
        NSSpeechRecognitionUsageDescription: Amber turns what you say into words on your phone, so you can talk to what your chat made.
        NSExtension:
          NSExtensionPointIdentifier: com.apple.message-payload-provider
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).MessagesViewController
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.calebnewton.amber.messages
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: iMessage App Icon
